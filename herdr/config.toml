onboarding = false

[ui.sound]
enabled = false

[theme]
name = "terminal"
auto_switch = false

# Contrast fixes for the "terminal" theme on Ghostty Coolnight.
# Note: accent also colors the focused pane border; surface_dim also draws
# the sidebar separator lines.
[theme.custom]
accent = "#2A6A9A"         # active tab bg + focused pane border
active_row_bg = "#1A4A6E"  # active sidebar row
surface_dim = "#CBE0F0"    # active tab text + sidebar separators
