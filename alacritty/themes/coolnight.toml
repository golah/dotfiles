# Coolnight — navy field, mint cursor, cyan accents
# Bright slots are lighter than normal; white is actually white.

[colors.primary]
background = '#011423'
foreground = '#CBE0F0'

[colors.cursor]
text = "#011423"
cursor = "#47FF9C"

[colors.selection]
